# GitLeaks configuration to prevent secrets from being committed
title = "Vansah BrowserStack Security Config"

[[rules]]
id = "browserstack-access-key"
description = "BrowserStack Access Key"
regex = '''(?i)(browserstack[_-]?access[_-]?key[\"']?\s*[:=]\s*[\"']?)([a-zA-Z0-9]{20,})'''
tags = ["key", "browserstack"]

[[rules]]
id = "browserstack-username"
description = "BrowserStack Username"
regex = '''(?i)(browserstack[_-]?username[\"']?\s*[:=]\s*[\"']?)([a-zA-Z0-9_-]{5,})'''
tags = ["username", "browserstack"]

[[rules]]
id = "vansah-jwt-token"
description = "Vansah JWT Token"
regex = '''eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*'''
tags = ["token", "jwt", "vansah"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|access[_-]?token)[\"']?\s*[:=]\s*[\"']?[a-zA-Z0-9]{20,}'''
tags = ["key", "api"]

[[rules]]
id = "generic-password"
description = "Generic Password"
regex = '''(?i)(password|passwd|pwd)[\"']?\s*[:=]\s*[\"'][^\"']{8,}[\"']'''
tags = ["password"]

[allowlist]
description = "Allowlist for safe patterns"
regexes = [
    '''your_browserstack_username''',
    '''your_browserstack_access_key''',
    '''your_vansah_token_here''',
    '''YOUR_[A-Z_]+''',
    '''VANSAH_TOKEN[\"']?\s*[:=]\s*[\"']?Your Token Here''',
]

paths = [
    '''\.example$''',
    '''SECURITY\.md$''',
    '''CREDENTIAL_LEAK_REPORT\.md$''',
    '''README\.md$''',
    '''ENV_SETUP\.md$''',
]

